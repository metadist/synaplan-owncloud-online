name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Synaplan the app is tested against, the one synaplan-nextcloud pins;
  # scripts/synaplan-openapi.sh, scripts/vendor-contract.sh and the Makefile
  # read it from here.
  SYNAPLAN_IMAGE_DIGEST: sha256:033410cc5391101e3fe530678932839984f7e87cb596e550443e82f1cb9ae29f

jobs:
  php:
    name: PHP (ownCloud.online ${{ matrix.oco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version the README names, and the newest v11.0.* tag.
        oco: [v11.0.10, v11.0.29]
    env:
      OCO_TAG: ${{ matrix.oco }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress
      - run: scripts/ocp.sh
      - run: composer run lint
      - run: composer run stan
      - run: composer run test

  contract:
    name: Contract (pinned Synaplan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress
      - run: scripts/ocp.sh
      - run: scripts/synaplan-openapi.sh
      - run: scripts/vendor-contract.sh --check
      - run: composer run test:contract

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check-types
      - run: npm run test:unit
      - run: npm run build

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: make package

      - run: scripts/check-tarball.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oco_synaplan-unsigned
          path: oco_synaplan.tar.gz
          retention-days: 7

  e2e:
    name: E2E (ownCloud.online ${{ matrix.oco }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        oco: [v11.0.10, v11.0.29]
    env:
      OCO_TAG: ${{ matrix.oco }}
    defaults:
      run:
        working-directory: oco
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: oco

      # The test stack files come from the commit the pinned image was built
      # from, so SYNAPLAN_IMAGE_DIGEST stays the only pin.
      - name: Find the Synaplan commit of the pinned image
        id: synaplan
        run: |
          image="ghcr.io/metadist/synaplan@${SYNAPLAN_IMAGE_DIGEST}"
          docker pull -q "$image"
          ref="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if ! echo "$ref" | grep -qE '^[0-9a-f]{40}$'; then
            echo "The pinned Synaplan image has no source revision label." >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: metadist/synaplan
          ref: ${{ steps.synaplan.outputs.ref }}
          path: synaplan
          persist-credentials: false
          sparse-checkout: |
            /docker-compose.test.yml
            /docker-compose.test.ci.yml
            /backend/.env.test
            /frontend/tests/e2e/stub-servers/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: oco/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Check out ownCloud.online ${{ matrix.oco }}
        run: make dev-server

      - name: Start Synaplan and ownCloud.online ${{ matrix.oco }}
        run: make e2e-up

      - run: make test-e2e

      - name: Collect the server logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          docker exec synaplan-owncloud-dev cat /var/www/owncloud-data/owncloud.log > e2e-logs/owncloud.log 2>&1 || true
          docker logs synaplan-owncloud-dev > e2e-logs/owncloud-container.log 2>&1 || true
          docker logs synaplan-app-test > e2e-logs/synaplan.log 2>&1 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-owncloud-${{ matrix.oco }}
          path: |
            oco/playwright-report/
            oco/test-results/
            oco/e2e-logs/
          retention-days: 7

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [php, contract, frontend, package, e2e]
    if: always()
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more checks failed or were cancelled"
          exit 1

      - name: All checks passed
        if: "!(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))"
        run: echo "All checks passed"
